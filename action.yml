name: "Terraform AI Review"
description: "Review Terraform plans in pull requests with the Claude API and post findings as a PR comment"
author: "liorenline"

branding:
  icon: "shield"
  color: "purple"

inputs:
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  working-directory:
    description: "Directory with Terraform code"
    required: false
    default: "terraform"
  model:
    description: "Claude model id"
    required: false
    default: "claude-sonnet-5-5"
  language:
    description: "Language of the review text"
    required: false
    default: "English"
  fail-on:
    description: "Fail the job if risk level is at or above this value: low, medium, high, critical"
    required: false
    default: ""
  github-token:
    description: "Token used to post the PR comment"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform init & plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform init -input=false
        terraform plan -input=false -out=tfplan
        terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

    - name: Collect PR diff
      shell: bash
      env:
        TF_DIR: ${{ inputs.working-directory }}
        BASE_REF: ${{ github.base_ref }}
      run: git diff "origin/$BASE_REF...HEAD" -- "$TF_DIR" > "$RUNNER_TEMP/pr.diff"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install deps
      shell: bash
      run: pip install -r "${{ github.action_path }}/scripts/requirements.txt"

    - name: AI review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PLAN_JSON: ${{ runner.temp }}/plan.json
        PR_DIFF: ${{ runner.temp }}/pr.diff
        CLAUDE_MODEL: ${{ inputs.model }}
        REVIEW_LANGUAGE: ${{ inputs.language }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: python "${{ github.action_path }}/scripts/ai_review.py"