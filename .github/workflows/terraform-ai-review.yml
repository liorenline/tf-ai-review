name: Terraform AI Review

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/**"
      - "action.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          working-directory: terraform
          language: English